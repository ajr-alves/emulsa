name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Tests and safety checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt bandit pip-audit
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Security scan of the code (bandit)
        run: bandit -r emulsa -c pyproject.toml
      - name: Known vulnerabilities in dependencies (pip-audit)
        run: pip-audit -r requirements.txt

  windows:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - name: Build Emulsa.exe
        run: pyinstaller --noconfirm --clean packaging/emulsa.spec
      - name: Self-test the built app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\Emulsa\Emulsa.exe -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          $version = (python -c "import emulsa; print(emulsa.__version__)")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: Emulsa-Windows
          path: dist/EmulsaSetup-*.exe

  macos:
    needs: checks
    runs-on: macos-14   # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - name: Build Emulsa.app
        run: pyinstaller --noconfirm --clean packaging/emulsa.spec
      - name: Self-test the built app
        run: dist/Emulsa.app/Contents/MacOS/Emulsa --self-test
      - name: Build .dmg
        run: bash packaging/make_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Emulsa-macOS
          path: dist/Emulsa-*.dmg

  linux:
    needs: checks
    runs-on: ubuntu-22.04   # older base so the AppImage runs on more distributions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries Qt needs
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libdbus-1-3 libfontconfig1
      - run: pip install -r requirements.txt pyinstaller
      - name: Build the app
        run: pyinstaller --noconfirm --clean packaging/emulsa.spec
      - name: Self-test the built app
        run: dist/Emulsa/Emulsa --self-test
      - name: Build AppImage
        run: bash packaging/make_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Emulsa-Linux
          path: dist/Emulsa-*.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
